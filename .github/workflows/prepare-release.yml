name: Prepare release

on:
  workflow_call:

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Reuse release or create a draft
        run: |
          if gh release view "$RELEASE_TAG" --json tagName > /dev/null; then
            echo "Using existing release: $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes ""
          fi
