- name: Install Rust
  uses: dtolnay/rust-toolchain@stable
  with:
    components: rustfmt, clippy
- name: Cache Rust
  uses: Swatinem/rust-cache@v2
- name: Check formatting
  run: cargo fmt --check
- name: Clippy
  run: cargo clippy --locked --all-targets -- -D warnings
- name: Tests
  run: cargo test --locked
